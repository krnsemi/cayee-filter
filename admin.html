// ==================== 状态 ====================
let state = {
  loggedIn: false,
  categories: FALLBACK_DATA.categories,
  products: [],
  currentCategoryId: 'mlcc',
  currentKindKey: '',
  loading: true,
  message: null,
  messageType: null,
  modal: null,
  readOnly: false,
  uploadOpen: false,
  uploadRows: [],
  uploadCols: []
};

// ==================== 初始化 ====================
function init() {
  const saved = sessionStorage.getItem('cayee_admin_login');
  if (saved === '1') state.loggedIn = true;
  render();
  if (state.loggedIn) loadData();
}

async function loadData() {
  state.loading = true;
  state.readOnly = false;
  render();

  // 未配置 Supabase 时进入本地示例数据模式
  if (!SUPABASE_URL || !SUPABASE_KEY) {
    state.categories = FALLBACK_DATA.categories;
    state.products = FALLBACK_DATA.products.slice();
    initCategoryAndKind();
    state.loading = false;
    showMessage('当前使用内嵌示例数据（本地模式），刷新页面后会重置。', 'info');
    render();
    return;
  }

  if (!_supabaseClient) {
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 100));
      if (initSupabaseClient()) break;
      if (window.__supabaseLoadFailed) break;
    }
  }
  if (!_supabaseClient) {
    const reason = window.__supabaseLoadFailed ? 'CDN 加载失败' : 'SDK 加载超时';
    showMessage('Supabase 未就绪（' + reason + '），已切换到内嵌示例数据（只读）', 'error');
    state.categories = FALLBACK_DATA.categories;
    state.products = FALLBACK_DATA.products.slice();
    initCategoryAndKind();
    state.readOnly = true;
    state.loading = false;
    render();
    return;
  }
  try {
    const timeout = (ms) => new Promise((_, reject) => setTimeout(() => reject(new Error('数据库连接超时，请检查网络或刷新重试')), ms));
    const [catResult, prodResult] = await Promise.race([
      Promise.all([
        _supabaseClient.from('categories').select('*'),
        _supabaseClient.from('products').select('*')
      ]),
      timeout(8000)
    ]);
    const { data: cats, error: err1 } = catResult;
    const { data: prods, error: err2 } = prodResult;
    if (err1) throw err1;
    if (err2) throw err2;
    // 数据库字段映射：name/config -> 代码使用的 display_name/kinds_config
    state.categories = (cats || []).map(c => {
      let kindsConfig = c.kinds_config;
      if (!kindsConfig && c.config) {
        if (Array.isArray(c.config.filters)) {
          kindsConfig = { kinds: [{ key: 'default', name: c.name || c.display_name, filters: c.config.filters }] };
        } else if (c.config.kinds) {
          kindsConfig = c.config;
        } else {
          kindsConfig = { kinds: [{ key: 'default', name: c.name || c.display_name, filters: [] }] };
        }
      }
      if (!kindsConfig) {
        kindsConfig = { kinds: [{ key: 'default', name: c.name || c.display_name, filters: [] }] };
      }
      return {
        ...c,
        display_name: c.display_name || c.name,
        kinds_config: kindsConfig
      };
    });
    state.products = (prods || []).map(p => ({
      ...p,
      kind: p.kind || 'default'
    }));
    initCategoryAndKind();
  } catch (e) {
    console.error(e);
    showMessage('数据库连接失败：' + e.message + '，已切换到内嵌示例数据（只读）', 'error');
    state.categories = FALLBACK_DATA.categories;
    state.products = FALLBACK_DATA.products.slice();
    initCategoryAndKind();
    state.readOnly = true;
  }
  state.loading = false;
  render();
}

function initCategoryAndKind() {
  if (!state.categories.length) return;
  const cat = state.categories.find(c => c.id === state.currentCategoryId) || state.categories[0];
  state.currentCategoryId = cat.id;
  const kinds = cat.kinds_config?.kinds || [];
  state.currentKindKey = kinds.length ? kinds[0].key : '';
}

function getCategory() {
  return state.categories.find(c => c.id === state.currentCategoryId) || state.categories[0];
}
function getKinds() {
  return getCategory()?.kinds_config?.kinds || [];
}
function getCurrentKind() {
  return getKinds().find(k => k.key === state.currentKindKey) || getKinds()[0];
}
function getFilteredProducts() {
  return state.products.filter(p => p.category === state.currentCategoryId && p.kind === state.currentKindKey);
}

function showMessage(text, type) {
  state.message = text;
  state.messageType = type;
  render();
  setTimeout(() => { state.message = null; render(); }, 4000);
}

// ==================== 登录 ====================
function login(password) {
  if (password === undefined) {
    const input = document.getElementById('pwd');
    password = input ? input.value : '';
  }
  if (password === ADMIN_PASSWORD) {
    state.loggedIn = true;
    sessionStorage.setItem('cayee_admin_login', '1');
    loadData();
  } else {
    showMessage('密码错误', 'error');
    render();
  }
}
function logout() {
  state.loggedIn = false;
  sessionStorage.removeItem('cayee_admin_login');
  render();
}

// ==================== 产品 CRUD ====================
function openAddModal() {
  const kind = getCurrentKind();
  if (!kind) return;
  state.modal = {
    mode: 'add',
    product: {
      category: state.currentCategoryId,
      kind: kind.key,
      model: '',
      manufacturer: '',
      price: '',
      datasheet_url: '',
      image_url: '',
      remark: '',
      spec_data: {}
    }
  };
  render();
}
function openEditModal(product) {
  state.modal = {
    mode: 'edit',
    product: { ...product, spec_data: { ...product.spec_data } }
  };
  render();
}
function closeModal() {
  state.modal = null;
  render();
}
function updateSpecField(key, value) {
  state.modal.product.spec_data[key] = value;
  render();
}
function updateProductField(key, value) {
  state.modal.product[key] = value;
  render();
}
async function saveProduct() {
  const p = state.modal.product;
  if (!p.model || !p.manufacturer) {
    showMessage('型号和制造商为必填项', 'error');
    return;
  }
  if (state.readOnly) {
    showMessage('当前为只读模式，无法保存', 'error');
    return;
  }

  // 本地模式：直接操作内存数据
  if (!SUPABASE_URL || !SUPABASE_KEY || !_supabaseClient) {
    if (state.modal.mode === 'add') {
      const newId = state.products.length ? Math.max(...state.products.map(x => x.id || 0)) + 1 : 1;
      state.products.push({
        id: newId,
        category: p.category,
        kind: p.kind,
        model: p.model,
        manufacturer: p.manufacturer,
        spec_data: p.spec_data,
        price: p.price,
        datasheet_url: p.datasheet_url,
        image_url: p.image_url,
        remark: p.remark
      });
      showMessage('添加成功（本地模式）', 'success');
    } else {
      const idx = state.products.findIndex(x => x.id === p.id);
      if (idx >= 0) {
        state.products[idx] = {
          id: p.id,
          category: p.category,
          kind: p.kind,
          model: p.model,
          manufacturer: p.manufacturer,
          spec_data: p.spec_data,
          price: p.price,
          datasheet_url: p.datasheet_url,
          image_url: p.image_url,
          remark: p.remark
        };
        showMessage('更新成功（本地模式）', 'success');
      } else {
        showMessage('未找到要更新的产品', 'error');
        return;
      }
    }
    state.modal = null;
    render();
    return;
  }

  const payload = {
    category: p.category,
    kind: p.kind,
    model: p.model,
    manufacturer: p.manufacturer,
    spec_data: p.spec_data,
    price: p.price,
    datasheet_url: p.datasheet_url,
    image_url: p.image_url,
    remark: p.remark
  };
  try {
    if (state.modal.mode === 'add') {
      const { error } = await _supabaseClient.from('products').insert(payload);
      if (error) throw error;
      showMessage('添加成功', 'success');
    } else {
      const { error } = await _supabaseClient.from('products').update(payload).eq('id', p.id);
      if (error) throw error;
      showMessage('更新成功', 'success');
    }
    state.modal = null;
    await loadData();
  } catch (e) {
    showMessage('保存失败：' + e.message, 'error');
  }
}
async function deleteProduct(id) {
  if (!confirm('确定删除这条产品？')) return;
  if (state.readOnly) {
    showMessage('当前为只读模式，无法删除', 'error');
    return;
  }

  // 本地模式：直接操作内存数据
  if (!SUPABASE_URL || !SUPABASE_KEY || !_supabaseClient) {
    state.products = state.products.filter(x => x.id !== id);
    showMessage('删除成功（本地模式）', 'success');
    render();
    return;
  }

  try {
    const { error } = await _supabaseClient.from('products').delete().eq('id', id);
    if (error) throw error;
    showMessage('删除成功', 'success');
    await loadData();
  } catch (e) {
    showMessage('删除失败：' + e.message, 'error');
  }
}

// ==================== 表格批量上传 ====================
function toggleUploadPanel() {
  state.uploadOpen = !state.uploadOpen;
  if (!state.uploadOpen) {
    state.uploadRows = [];
    state.uploadCols = [];
  }
  render();
}

function getTemplateColumns() {
  const kind = getCurrentKind();
  const base = ['model', 'manufacturer', 'price', 'datasheet_url', 'image_url', 'remark'];
  const filters = kind ? kind.filters.map(f => f.key) : [];
  return base.concat(filters);
}

function downloadTemplate() {
  const kind = getCurrentKind();
  const cat = getCategory();
  const cols = getTemplateColumns();
  const header = cols.join(',');
  // 示例一行
  const filters = kind ? kind.filters : [];
  const sample = cols.map(c => {
    if (c === 'model') return '示例型号';
    if (c === 'manufacturer') return 'CAYEE';
    if (c === 'price') return '0.00';
    if (c === 'datasheet_url' || c === 'image_url' || c === 'remark') return '';
    const f = filters.find(x => x.key === c);
    return f ? '示例值' : '';
  }).join(',');
  const csv = '\uFEFF' + header + '\n' + sample + '\n';
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `CAYEE上传模板_${cat.id}_${kind.key || 'default'}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCSV(text) {
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim() !== '');
  if (lines.length < 1) return { cols: [], rows: [] };
  const parseLine = (line) => {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      const next = line[i + 1];
      if (inQuotes) {
        if (ch === '"') {
          if (next === '"') { current += '"'; i++; }
          else { inQuotes = false; }
        } else { current += ch; }
      } else {
        if (ch === '"') { inQuotes = true; }
        else if (ch === ',') { result.push(current); current = ''; }
        else { current += ch; }
      }
    }
    result.push(current);
    return result;
  };
  const cols = parseLine(lines[0]).map(c => c.trim());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const values = parseLine(lines[i]);
    const row = {};
    cols.forEach((c, idx) => { row[c] = values[idx] !== undefined ? values[idx].trim() : ''; });
    rows.push(row);
  }
  return { cols, rows };
}

function handleFileUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      const { cols, rows } = parseCSV(text);
      if (!cols.length || !rows.length) {
        showMessage('未解析到有效数据，请检查文件格式', 'error');
        return;
      }
      // 过滤空行
      const validRows = rows.filter(r => Object.values(r).some(v => v !== ''));
      state.uploadCols = cols;
      state.uploadRows = validRows;
      state.uploadOpen = true;
      showMessage(`已解析 ${validRows.length} 条数据，请预览后确认导入`, 'info');
      render();
    } catch (err) {
      showMessage('文件解析失败：' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function rowToProduct(row) {
  const cat = getCategory();
  const kind = getCurrentKind();
  const baseFields = ['model', 'manufacturer', 'price', 'datasheet_url', 'image_url', 'remark'];
  const product = {
    category: cat ? cat.id : '',
    kind: kind ? kind.key : 'default',
    model: row.model || '',
    manufacturer: row.manufacturer || '',
    price: row.price || '',
    datasheet_url: row.datasheet_url || '',
    image_url: row.image_url || '',
    remark: row.remark || '',
    spec_data: {}
  };
  Object.keys(row).forEach(key => {
    if (!baseFields.includes(key)) {
      product.spec_data[key] = row[key] || '';
    }
  });
  return product;
}

async function confirmUpload() {
  const rows = state.uploadRows || [];
  if (!rows.length) {
    showMessage('没有可导入的数据', 'error');
    return;
  }
  const products = rows.map(rowToProduct).filter(p => p.model);
  if (!products.length) {
    showMessage('未找到有效型号，请检查模板列名是否包含 model', 'error');
    return;
  }

  if (state.readOnly) {
    showMessage('当前为只读模式，无法导入', 'error');
    return;
  }

  // 本地模式
  if (!SUPABASE_URL || !SUPABASE_KEY || !_supabaseClient) {
    let nextId = state.products.length ? Math.max(...state.products.map(x => x.id || 0)) + 1 : 1;
    products.forEach(p => {
      state.products.push({ ...p, id: nextId++ });
    });
    showMessage(`成功导入 ${products.length} 条产品（本地模式）`, 'success');
    state.uploadRows = [];
    state.uploadCols = [];
    state.uploadOpen = false;
    render();
    return;
  }

  try {
    const { error } = await _supabaseClient.from('products').insert(products);
    if (error) throw error;
    showMessage(`成功导入 ${products.length} 条产品`, 'success');
    state.uploadRows = [];
    state.uploadCols = [];
    state.uploadOpen = false;
    await loadData();
  } catch (e) {
    showMessage('批量导入失败：' + e.message, 'error');
  }
}

function clearUpload() {
  state.uploadRows = [];
  state.uploadCols = [];
  render();
}

// ==================== 渲染 ====================
function render() {
  const app = document.getElementById('app');
  if (!state.loggedIn) {
    app.innerHTML = renderLogin();
    return;
  }
  app.innerHTML = renderAdmin();
  bindAdminEvents();
}

function renderLogin() {
  return `
    <div class="login-box">
      <h2>CAYEE后台管理</h2>
      ${state.message ? `<div class="error-msg">${state.message}</div>` : ''}
      <input type="password" id="pwd" placeholder="请输入密码" onkeydown="if(event.key==='Enter') login()">
      <button class="btn btn-primary" onclick="login()">登录</button>
    </div>
  `;
}

function renderAdmin() {
  return `
    <div class="wrap">
      <header>
        <div>
          <h1>CAYEE参数筛选器 - 后台管理</h1>
          <p>管理 MLCC、贴片铝电解电容、自恢复保险丝型号与参数</p>
        </div>
        <button class="btn btn-default" onclick="logout()">退出登录</button>
      </header>
      ${state.message ? `<div class="status-tip ${state.messageType}">${state.message}</div>` : ''}
      <div class="cat-bar">
        ${state.categories.map(cat => {
          const active = cat.id === state.currentCategoryId ? 'active' : '';
          return `<button class="cat-btn ${active}" data-id="${cat.id}">${cat.display_name}</button>`;
        }).join('')}
      </div>
      <div class="panel">
        ${state.loading ? '<div class="loading">正在加载数据...</div>' : renderKindPanel()}
      </div>
    </div>
    ${state.modal ? renderModal() : ''}
  `;
}

function renderKindPanel() {
  const kinds = getKinds();
  const kind = getCurrentKind();
  if (!kind) return '<div class="empty-state">当前分类没有配置子类型</div>';
  const products = getFilteredProducts();
  return `
    ${kinds.length > 1 ? `
      <div class="kind-bar">
        ${kinds.map(k => {
          const active = k.key === state.currentKindKey ? 'active' : '';
          return `<button class="kind-btn ${active}" data-key="${k.key}">${k.name}</button>`;
        }).join('')}
      </div>
    ` : ''}
    <div class="toolbar">
      <div><strong>${kind.name}</strong>（共 ${products.length} 条）</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-default" onclick="downloadTemplate()">下载模板</button>
        <button class="btn btn-default" onclick="toggleUploadPanel()">表格上传</button>
        <button class="btn btn-primary" onclick="openAddModal()">+ 添加型号</button>
      </div>
    </div>
    ${renderUploadPanel(kind)}
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>图片</th><th>型号</th><th>制造商</th>${kind.filters.map(f => `<th>${escapeHtml(f.name)}</th>`).join('')}<th>参考价格</th><th>数据手册</th><th>备注</th><th>操作</th></tr>
        </thead>
        <tbody>
          ${products.length ? products.map(p => `
            <tr>
              <td>${p.id}</td>
              <td>${p.image_url ? `<img src="${escapeHtml(p.image_url)}" class="admin-thumb" alt="">` : '-'}</td>
              <td>${escapeHtml(p.model)}</td>
              <td>${escapeHtml(p.manufacturer)}</td>
              ${kind.filters.map(f => `<td>${escapeHtml(p.spec_data?.[f.key] || '-')}</td>`).join('')}
              <td>${escapeHtml(p.price || '-')}</td>
              <td>${p.datasheet_url ? `<a href="${escapeHtml(p.datasheet_url)}" target="_blank">链接</a>` : '-'}</td>
              <td>${escapeHtml(p.remark || '-')}</td>
              <td class="actions">
                <button class="btn btn-primary" onclick="openEditModal(${JSON.stringify(p).replace(/"/g, '&quot;')})">编辑</button>
                <button class="btn btn-danger" onclick="deleteProduct(${p.id})">删除</button>
              </td>
            </tr>
          `).join('') : `<tr><td colspan="${8 + kind.filters.length}" class="empty-state">该子类型下暂无产品</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

function renderUploadPanel(kind) {
  if (!state.uploadOpen) return '';
  const rows = state.uploadRows || [];
  const cols = state.uploadCols || [];
  return `
    <div class="upload-panel">
      <div class="upload-title">表格批量上传（当前分类：${escapeHtml(kind.name)}）</div>
      <div class="upload-desc">请下载模板，按模板格式填写后上传 CSV 文件。</div>
      <div class="upload-actions">
        <button class="btn btn-default" onclick="downloadTemplate()">下载 CSV 模板</button>
        <input type="file" id="uploadFile" accept=".csv" onchange="handleFileUpload(this)">
      </div>
      ${rows.length ? `
        <div class="upload-preview">
          <div class="upload-preview-title">预览（共 ${rows.length} 条）</div>
          <div style="overflow-x:auto;">
            <table class="upload-table">
              <thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
              <tbody>${rows.slice(0, 10).map(row => `<tr>${cols.map(c => `<td>${escapeHtml(row[c] !== undefined ? row[c] : '')}</td>`).join('')}</tr>`).join('')}</tbody>
            </table>
            ${rows.length > 10 ? `<div class="upload-more">还有 ${rows.length - 10} 条未显示</div>` : ''}
          </div>
          <div style="margin-top:12px;">
            <button class="btn btn-primary" onclick="confirmUpload()">确认导入</button>
            <button class="btn btn-default" onclick="clearUpload()" style="margin-left:8px;">清空</button>
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function renderModal() {
  const p = state.modal.product;
  const kind = getCurrentKind();
  const title = state.modal.mode === 'add' ? '添加型号' : '编辑型号';
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label>型号 *</label>
              <input type="text" value="${escapeHtml(p.model)}" oninput="updateProductField('model', this.value)">
            </div>
            <div class="form-group">
              <label>制造商 *</label>
              <input type="text" value="${escapeHtml(p.manufacturer)}" oninput="updateProductField('manufacturer', this.value)">
            </div>
          </div>
          <div class="form-row">
            ${kind.filters.map(f => `
              <div class="form-group">
                <label>${escapeHtml(f.name)}</label>
                <input type="text" value="${escapeHtml(p.spec_data?.[f.key] || '')}" oninput="updateSpecField('${f.key}', this.value)">
              </div>
            `).join('')}
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>参考价格</label>
              <input type="text" value="${escapeHtml(p.price)}" oninput="updateProductField('price', this.value)">
            </div>
            <div class="form-group">
              <label>数据手册链接</label>
              <input type="text" value="${escapeHtml(p.datasheet_url)}" oninput="updateProductField('datasheet_url', this.value)">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>图片链接</label>
              <input type="text" value="${escapeHtml(p.image_url)}" oninput="updateProductField('image_url', this.value)" placeholder="https://example.com/image.png">
            </div>
            <div class="form-group">
              <label>备注</label>
              <input type="text" value="${escapeHtml(p.remark)}" oninput="updateProductField('remark', this.value)">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveProduct()">保存</button>
        </div>
      </div>
    </div>
  `;
}

function bindAdminEvents() {
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentCategoryId = btn.dataset.id;
      initCategoryAndKind();
      render();
    });
  });
  document.querySelectorAll('.kind-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentKindKey = btn.dataset.key;
      render();
    });
  });
}

function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

init();
</script>
